# SonarQube — self-hosted https://sonar.pathors.com (pathorsAI/pathors#2250).
# Scanned by .github/workflows/sonar.yml on every PR and every push to develop.
# Ticket: pathorsAI/pathors#2829.
#
# This repo carries the whole of upstream Chatwoot plus our own commits on top,
# so the full-project issue count is upstream's, not ours. The Quality Gate is
# new-code only (30-day window, inherited from the server default), which is
# what makes the gate a statement about the PR rather than about Chatwoot.
# Do not "fix" the baseline by touching upstream files; that only widens the
# next upstream sync.

sonar.projectKey=pathorsAI_inbox
sonar.projectName=inbox
sonar.sourceEncoding=UTF-8

# Block the merge on a failed Quality Gate rather than reporting after the fact.
sonar.qualitygate.wait=true

# Whole tree as sources; tests are carved out by pattern below, because
# frontend specs live next to the code (app/javascript/**/specs/*.spec.js) and
# cannot be expressed as a separate sonar.tests directory.
sonar.sources=.
sonar.test.inclusions=spec/**,**/specs/**,**/*.spec.js,**/*.spec.ts,**/*.test.js,**/*.test.ts

# --- Coverage is deliberately not evaluated ---
# Same parity decision as the pathors monorepo (#1505): nothing imports a
# SimpleCov / lcov report here, so `new_coverage` would resolve to 0 and fail
# every PR. Excluding everything leaves the metric without data and the gate
# evaluates its other conditions only. Undo by dropping this line and adding
# sonar.ruby.coverage.reportPaths / sonar.javascript.lcov.reportPaths plus a
# test run in the scan job.
sonar.coverage.exclusions=**

# --- Excluded from analysis entirely ---
# - build output, vendored code, runtime dirs: no reviewable source
# - lockfiles: an analysis whose changed-set includes one fails outright
# - db/schema.rb + db/migrate: generated / upstream-owned; a migration file is
#   never edited after it lands
# - locales (config/locales/*.yml, app/javascript/**/i18n/locale/**): pure data,
#   ~40 languages of the same strings. Our zh-TW work lives here too, but Sonar
#   has no rule that says anything useful about a translation file.
# - swagger/: OpenAPI fragments, hand-maintained upstream, not code
# - public/: compiled assets and vendored widget bundles
# - .qlty/ .circleci/ .devcontainer/ clevercloud/ theme/: upstream tooling and
#   hosting configs we neither run nor deploy
# - *.stories.js / *.fixtures.js: Histoire stories and test fixtures
sonar.exclusions=**/node_modules/**,public/**,vendor/**,tmp/**,log/**,storage/**,coverage/**,dist/**,**/*.min.js,**/*.lock,pnpm-lock.yaml,Gemfile.lock,db/schema.rb,db/migrate/**,config/locales/**,app/javascript/**/i18n/locale/**,app/javascript/**/i18n/locales/**,swagger/**,.qlty/**,.circleci/**,.devcontainer/**,clevercloud/**,theme/**,**/*.stories.js,**/*.fixtures.js,**/__mocks__/**

# --- Excluded from copy-paste (duplication) detection only ---
# Vue single-file components in the design system are structurally repetitive
# by design (one wrapper per reka-ui primitive).
sonar.cpd.exclusions=app/javascript/design-system/**

# The JS/TS analyzer runs a separate node process. Cap it explicitly: the
# self-hosted gke runner pod has a 5Gi limit shared with the scanner JVM
# (-Xmx set in the workflow), and the analyzer's default sizing assumes it owns
# the machine.
sonar.javascript.node.maxspace=2048
