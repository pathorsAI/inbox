name: Claude Code Review

on:
  pull_request:
    types: [opened, reopened]

jobs:
  claude-review:
    if: github.actor != 'dependabot[bot]'
    runs-on: [self-hosted, gke]
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 1

      # The gke runner pods do not ship gh; the review posts through `gh pr comment`.
      - name: Ensure gh CLI
        uses: ./.github/actions/ensure-gh-cli

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@d75b94d5ad426cb8546e6628b6f5f19b84e5cce1 # v1.0.216
        with:
          # Authenticate with the Claude subscription (OAuth token from `claude setup-token`), not an API key
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            This repository is a white-label fork of Chatwoot that tracks upstream: prefer the
            smallest diff that solves the problem and flag changes that would make merging
            upstream releases harder. Use the repository's CLAUDE.md for guidance on style and
            conventions. Be constructive and helpful in your feedback.

            Use `gh pr comment` with your Bash tool to leave your review as a comment on the PR.

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          claude_args: '--model claude-fable-5 --allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'
