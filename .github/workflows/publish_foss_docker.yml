# #
# # This action publishes the Pathors-branded Chatwoot CE image (enterprise/
# # stripped — the only build we may run commercially) to GHCR under the
# # pathorsAI org. Runs on merges to develop/master, tags, and manual dispatch.
# #

name: Publish Pathors Inbox CE docker images

on:
  push:
    branches:
      - develop
      - master
    tags:
      - v*
  workflow_dispatch:

env:
  DOCKER_REPO: ghcr.io/pathorsai/pathors-inbox

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # amd64 only. GKE (the only consumer of this image) is amd64, and a
          # private repo has no GitHub-hosted arm runner — `ubuntu-22.04-arm`
          # would queue forever. Re-add arm64 only with a runner that exists.
          - platform: linux/amd64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    env:
      GIT_REF: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Strip enterprise code
        run: |
          rm -rf enterprise
          rm -rf spec/enterprise

      - name: Set Chatwoot edition
        run: |
          echo -en '\nENV CW_EDITION="ce"' >> docker/Dockerfile

      - name: Set Docker Tags
        run: |
          SANITIZED_REF=$(echo "$GIT_REF" | sed 's/\//-/g')
          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "DOCKER_TAG=${DOCKER_REPO}:latest-ce" >> $GITHUB_ENV
          else
            echo "DOCKER_TAG=${DOCKER_REPO}:${SANITIZED_REF}-ce" >> $GITHUB_ENV
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          outputs: type=image,name=${{ env.DOCKER_REPO }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          GIT_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          SANITIZED_REF=$(echo "$GIT_REF" | sed 's/\//-/g')
          if [ "${{ github.ref_name }}" = "master" ]; then
            TAG="${DOCKER_REPO}:latest-ce"
          else
            TAG="${DOCKER_REPO}:${SANITIZED_REF}-ce"
          fi
          
          docker buildx imagetools create -t $TAG \
            $(printf '${{ env.DOCKER_REPO }}@sha256:%s ' *)

      - name: Inspect image
        env:
          GIT_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          SANITIZED_REF=$(echo "$GIT_REF" | sed 's/\//-/g')
          if [ "${{ github.ref_name }}" = "master" ]; then
            TAG="${DOCKER_REPO}:latest-ce"
          else
            TAG="${DOCKER_REPO}:${SANITIZED_REF}-ce"
          fi
          
          docker buildx imagetools inspect $TAG

  # Tell pathorsAI/pathors the image moved, so its chatwoot-digest-writeback
  # runs now instead of whenever GitHub gets round to the cron (best-effort on a
  # busy repo: measured 2–5h between scheduled runs, pathorsAI/pathors#2868).
  #
  # Only develop: `develop-ce` is the one tag the writeback deploys. The
  # writeback re-resolves the digest from the tag itself and does not trust
  # this payload — the payload is for the run log.
  #
  # The token is minted from the Pathors CD GitHub App (org-owned, contents:
  # write on pathors, ruleset bypass actor) and scoped to the pathors repo
  # only. repository_dispatch needs contents: write and nothing more, which is
  # why it is used instead of workflow_dispatch (actions: write).
  notify-pathors:
    if: github.event_name == 'push' && github.ref_name == 'develop'
    needs:
      - merge
    runs-on: ubuntu-latest
    steps:
      - name: Mint a token for pathorsAI/pathors
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CD_APP_ID }}
          private-key: ${{ secrets.CD_APP_PRIVATE_KEY }}
          owner: pathorsAI
          repositories: pathors

      - name: Dispatch pathors-inbox-published
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ env.DOCKER_REPO }}:develop-ce
          SOURCE_SHA: ${{ github.sha }}
        run: |
          gh api -X POST /repos/pathorsAI/pathors/dispatches \
            -f event_type=pathors-inbox-published \
            -F 'client_payload[tag]'="$TAG" \
            -F 'client_payload[source_sha]'="$SOURCE_SHA" \
            -F 'client_payload[run_url]'="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo "dispatched pathors-inbox-published for $TAG ($SOURCE_SHA)"
